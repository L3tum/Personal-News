[package]
name = "rss_digest"
version = "0.1.0"
edition = "2021"
description = "Daily RSS digest with RAG-powered summarization using FreshRSS, Qdrant, and Ollama"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (no native TLS)
reqwest = { version = "0.13", features = ["json", "stream", "rustls-tls"], default-features = false }

# Vector database (Qdrant) — disable default features, reqwest uses rustls via our direct dep
qdrant-client = { version = "1.18.0", default-features = false, features = ["reqwest", "serde"] }

# Email sending
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls", "smtp-transport", "webpki-roots", "ring", "builder"] }
pulldown-cmark = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }

# MD5 for Fever API authentication
md5 = "0.7"
